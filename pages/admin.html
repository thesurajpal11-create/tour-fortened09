<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Ramnagari Tourism</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="site-header">
        <nav class="navbar">
            <div class="container nav-inner">
                <a href="../index.html" class="brand">
                    <span class="brand-mark">
                        <img src="../images/logo.jpeg" alt="Ramnagari Tourism logo" class="brand-logo" onerror="this.style.display='none'">
                        <span class="brand-fallback">RT</span>
                    </span>
                    <span class="brand-text">
                        <strong>Ramnagari Tourism</strong>
                        <small>Admin Panel</small>
                    </span>
                </a>
                <div class="nav-menu is-open-static">
                    <a href="../index.html">Website</a>
                    <a href="hotels.html">Customer Hotels Page</a>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="page-banner admin-banner">
            <div class="container page-banner-content">
                <span class="section-script">Admin Panel</span>
                <h1>Add hotels, room types, and prices.</h1>
                <p>After saving hotel and room price here, customers can see category, price, rooms, amenities, and distance on the Hotels page.</p>
            </div>
        </section>

        <section class="section">
            <div class="container admin-layout">
                <form class="content-card admin-form" id="adminLoginForm">
                    <h2>Admin Login</h2>
                    <label>
                        <span>Email</span>
                        <input type="email" id="adminEmail" placeholder="admin@example.com" autocomplete="username" required>
                    </label>
                    <label>
                        <span>Password</span>
                        <input type="password" id="adminPassword" placeholder="Enter admin password" autocomplete="current-password" required>
                    </label>
                    <button type="submit" class="btn btn-primary">Login</button>
                    <p class="admin-message" id="adminLoginMessage"></p>
                </form>

                <form class="content-card admin-form admin-hotel-form is-hidden" id="addHotelForm">
                    <h2>Add Hotel</h2>
                    <div class="admin-two-fields">
                        <label>
                            <span>Owner Name</span>
                            <input type="text" id="ownerName" placeholder="Shri Ram Hotel Group" autocomplete="organization" required>
                        </label>
                        <label>
                            <span>Owner Email</span>
                            <input type="email" id="ownerEmail" placeholder="owner@example.com" autocomplete="email" required>
                        </label>
                    </div>
                    <label>
                        <span>Owner Phone</span>
                        <input type="tel" id="ownerPhone" placeholder="9876543210" autocomplete="tel">
                    </label>
                    <div class="admin-two-fields">
                        <label>
                            <span>Destination</span>
                            <select id="hotelDestination" required></select>
                        </label>
                        <label>
                            <span>Hotel Type</span>
                            <select id="hotelCategory" required>
                                <option value="Budget">Budget</option>
                                <option value="2 Star">2 Star</option>
                                <option value="3 Star">3 Star</option>
                                <option value="4 Star">4 Star</option>
                            </select>
                        </label>
                    </div>
                    <label>
                        <span>Hotel Name</span>
                        <input type="text" id="realHotelName" placeholder="Hotel Ram Palace" autocomplete="organization" required>
                    </label>
                    <label>
                        <span>Address</span>
                        <input type="text" id="hotelAddress" placeholder="Near Ram Mandir, Ayodhya" autocomplete="street-address">
                    </label>
                    <div class="admin-two-fields">
                        <label>
                            <span>Nearby Place</span>
                            <input type="text" id="nearbyPlace" placeholder="Near Ram Mandir">
                        </label>
                        <label>
                            <span>Distance KM</span>
                            <input type="number" id="hotelDistance" min="0" step="0.1" value="1.5" required>
                        </label>
                    </div>
                    <label>
                        <span>Amenities</span>
                        <input type="text" id="hotelAmenities" value="AC Room, WiFi, Parking, Breakfast">
                    </label>
                    <div class="admin-two-fields">
                        <label>
                            <span>Check-in</span>
                            <input type="text" id="checkInTime" value="12:00 PM">
                        </label>
                        <label>
                            <span>Check-out</span>
                            <input type="text" id="checkOutTime" value="11:00 AM">
                        </label>
                    </div>
                    <label>
                        <span>Rooms Available</span>
                        <input type="number" id="roomsAvailable" min="1" value="15" required>
                    </label>
                    <div class="admin-two-fields">
                        <label>
                            <span>Base Price</span>
                            <input type="number" id="basePrice" min="0" value="2200" required>
                        </label>
                        <label>
                            <span>Selling Price</span>
                            <input type="number" id="sellingPrice" min="0" value="3000" required>
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary" id="addHotelButton">Add Hotel</button>
                    <p class="admin-message" id="addHotelMessage" role="status" aria-live="polite"></p>
                </form>
            </div>
        </section>
    </main>

    <script src="../js/admin-hotels.js"></script>
</body>
</html>
